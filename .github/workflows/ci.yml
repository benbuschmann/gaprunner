name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests (no GPU needed)
        run: python -m unittest discover -s tests
      - name: Build and install the wheel in a clean environment
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/gaprunner --help > /dev/null
          /tmp/clean/bin/gaprunner example > example.toml
          /tmp/clean/bin/python -c "import importlib.resources as r; assert r.files('gaprunner').joinpath('ui.html').is_file()"
